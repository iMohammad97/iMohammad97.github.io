<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copy Link</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff}button{font:600 22px system-ui,sans-serif;padding:20px 48px;border:0;border-radius:12px;background:#1769e0;color:white;cursor:pointer}button:focus-visible{outline:3px solid #222;outline-offset:5px}</style>
</head>
<body>
<button id="copy" type="button">Copy Link</button>
<script>
const link = 'https://arc23.amlakbaran.com/sub/djMsNDk1OCwxNzk1NDYyMTI0.eyRCXK8iCovNFUHRK-dl8y9Znr_6y0khv4OM_Ed5gtA';
const button = document.getElementById('copy');
function fallback(){const field=document.createElement('textarea');field.value=link;field.style.position='fixed';field.style.opacity='0';document.body.appendChild(field);field.select();field.setSelectionRange(0,field.value.length);try{return document.execCommand('copy')}finally{field.remove();}}
button.onclick=async()=>{let ok=false;try{if(navigator.clipboard){await navigator.clipboard.writeText(link);ok=true}else{ok=fallback()}}catch(e){try{ok=fallback()}catch(e){}}button.textContent=ok?'Copied!':'Copy failed — retry';setTimeout(()=>button.textContent='Copy Link',2000)};
</script>
</body>
</html>
